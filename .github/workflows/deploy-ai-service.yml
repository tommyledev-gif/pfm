name: AI Service CI-CD Deploy

# Monorepo trigger: only fires when ai-service/ (or this workflow, or the
# shared compose file it now appears in) changes — mirrors deploy-backend.yml.
on:
  push:
    branches:
      - develop
    paths:
      - "ai-service/**"
      - "backend/docker-compose.yml"
      - ".github/workflows/deploy-ai-service.yml"
  workflow_dispatch:

concurrency:
  group: ai-service-deploy-develop
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only ai-service/ is sent to the Docker build context, same isolation
      # principle as deploy-backend.yml's backend-only build.
      - name: Build and push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-ai-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-ai-service:${{ github.sha }}

      # Non-blocking for now, same as deploy-backend.yml's Trivy step —
      # flip exit-code to '1' once baseline findings are triaged.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/pfm-ai-service:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # docker-compose.yml/deploy.sh live under backend/ but now also define
      # ai-service — keep the VPS copy in sync regardless of which workflow
      # last touched them.
      - name: Sync deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/deploy.sh,backend/docker-compose.yml"
          target: "${{ secrets.VPS_APP_DIR }}"

      # ai-service has no health-check/rollback dance like deploy-backend.yml
      # — it's a secondary service the backend already degrades gracefully
      # around (502 AI_SERVICE_UNAVAILABLE), so a plain pull+up is enough.
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}/backend"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            if [ -n "${{ secrets.VPS_ENV_PROD }}" ]; then
              printf '%s\n' "${{ secrets.VPS_ENV_PROD }}" | sed -e 's/\r$//' > .env.prod
            fi

            chmod +x deploy.sh

            LAST_GOOD_TAG_FILE=".last_good_tag"
            PFM_BACKEND_IMAGE_TAG="latest"
            if [ -f "$LAST_GOOD_TAG_FILE" ]; then
              PFM_BACKEND_IMAGE_TAG="$(cat "$LAST_GOOD_TAG_FILE")"
            fi

            DOCKER_REGISTRY_USER="${{ secrets.DOCKERHUB_USERNAME }}" \
              PFM_BACKEND_IMAGE_TAG="$PFM_BACKEND_IMAGE_TAG" \
              PFM_AI_SERVICE_IMAGE_TAG="${{ github.sha }}" \
              ./deploy.sh

            for i in $(seq 1 10); do
              if docker exec pfm-ai-service-container wget -qO /dev/null http://127.0.0.1:8000/health; then
                echo "Health check passed: ai-service /health is up"
                exit 0
              fi
              echo "Attempt ${i}/10: ai-service /health not ready, retrying in 10s"
              sleep 10
            done

            echo "Health check timeout: ai-service /health never came up"
            docker logs --tail 200 pfm-ai-service-container || true
            exit 1
