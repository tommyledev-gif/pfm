name: Backend CI-CD Deploy

# Monorepo trigger: only fires when backend/ (or this workflow) changes, so a
# frontend/mobile/ai-service-only push never rebuilds or redeploys the Go API.
on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# A newer push waits for this run instead of cancelling it: cancelling killed
# the SSH session mid-deploy (between migrate and `up -d`, say), and the
# newer run then started from whatever state that left.
concurrency:
  group: backend-deploy-develop
  cancel-in-progress: false

jobs:
  # Same go vet/test steps as ci-pr.yml's PR gate — defined once in
  # backend-test.yml so a broken build can't reach build-and-push here either.
  test:
    uses: ./.github/workflows/backend-test.yml

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only backend/ is sent to the Docker build context — the image never
      # contains frontend/mobile/ai-service source, keeping it small and the
      # blast radius of a backend deploy limited to the backend.
      # Built into the runner's Docker daemon only (load, no push): Trivy
      # scans the exact image below, and it reaches the registry only if the
      # scan passes. Pushing first left a failed image (and :latest) published.
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:${{ github.sha }}

      # Blocking: a HIGH or CRITICAL CVE with a released fix stops the
      # release. Baseline on 2026-10-23 (specs/security-hardening-2026-10):
      # alpine 3.22 and the three Go binaries had none. Unfixed ones are
      # ignored: nothing to upgrade to yet.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push backend image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    # One VPS deploy at a time, across BOTH deploy workflows (concurrency
    # groups are repository-wide). deploy-ai-service.yml also runs deploy.sh
    # — migrate, `up -d` of every service, seed — and reads .last_good_tag,
    # and a push that touches backend/docker-compose.yml starts both. Run
    # side by side, they raced each other's migrate and `up -d`, and the AI
    # deploy could restart the backend on the tag from before this one.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only the backend's deploy files land on the VPS — no frontend/
      # mobile/ai-service source ever leaves the CI runner. Not the SQL
      # migrations: they are compiled into the image (backend/db/migrations.go).
      - name: Sync deployment files to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/deploy.sh,backend/docker-compose.yml,backend/ops"
          target: "${{ secrets.VPS_APP_DIR }}"

      # Secrets reach the remote script as environment variables (`envs`),
      # never as ${{ }} text inside it: GitHub pastes that text into the script
      # before the shell runs, so a `$`, backtick or quote in a value was
      # expanded or executed on the VPS. drone-ssh exports each one
      # single-quoted, so .env.prod is now byte-for-byte the secret.
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_ENV_PROD: ${{ secrets.VPS_ENV_PROD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: VPS_APP_DIR,VPS_ENV_PROD,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,NEW_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd "$VPS_APP_DIR/backend"

            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN

            # umask: created owner-only, never readable even for a moment
            # (deploy.sh also chmods it 600 on every run). Written beside the
            # live file and then moved, so a failed write never leaves a
            # truncated .env.prod behind.
            if [ -n "${VPS_ENV_PROD:-}" ]; then
              (umask 077; printf '%s\n' "$VPS_ENV_PROD" | sed -e 's/\r$//' > .env.prod.new)
              mv .env.prod.new .env.prod
            fi
            unset VPS_ENV_PROD

            chmod +x deploy.sh

            # .last_good_tag persists on the VPS across runs (this SCP step
            # only adds/overwrites deploy.sh/docker-compose.yml/ops, it
            # never deletes other files here) — it's how a failed health
            # check below knows which image tag to roll back to.
            LAST_GOOD_TAG_FILE=".last_good_tag"
            PREV_TAG=""
            if [ -f "$LAST_GOOD_TAG_FILE" ]; then
              PREV_TAG="$(cat "$LAST_GOOD_TAG_FILE")"
            fi

            deploy_tag() {
              DOCKER_REGISTRY_USER="$DOCKERHUB_USERNAME" \
                PFM_BACKEND_IMAGE_TAG="$1" \
                ./deploy.sh
            }

            # $2 is the probe path. A new release is gated on /health/ready (the
            # process is up AND it can reach Postgres), which is what catches a
            # wrong database password or a half-applied schema before traffic
            # does. A rollback target may be an image from before that route
            # existed, so rollbacks are judged on plain /health.
            check_health() {
              attempts="$1"
              probe="$2"
              i=1
              while [ "$i" -le "$attempts" ]; do
                if docker exec pfm-backend-container wget -qO /dev/null "http://127.0.0.1:8080/api/v1/${probe}"; then
                  return 0
                fi
                echo "Attempt ${i}/${attempts}: /${probe} not ready, retrying in 10s"
                sleep 10
                i=$((i + 1))
              done
              return 1
            }

            deploy_tag "$NEW_TAG"

            if check_health 20 health/ready; then
              echo "Health check passed: /api/v1/health/ready is up (tag ${NEW_TAG})"
              echo "$NEW_TAG" > "$LAST_GOOD_TAG_FILE"
              exit 0
            fi

            echo "Health check timeout: /api/v1/health/ready never came up for tag ${NEW_TAG}"
            docker logs --tail 200 pfm-backend-container || true

            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
              echo "Rolling back to last known-good image tag: ${PREV_TAG}"
              deploy_tag "$PREV_TAG"
              if check_health 10 health; then
                echo "Rollback to ${PREV_TAG} succeeded"
              else
                echo "Rollback to ${PREV_TAG} FAILED — manual intervention required"
                docker logs --tail 200 pfm-backend-container || true
              fi
            else
              echo "No previous known-good tag recorded — nothing to roll back to. Manual intervention required."
            fi

            # This run still fails either way: the pushed commit never became
            # healthy, so CI must go red even though prod was protected.
            exit 1
