name: Backend CI-CD Deploy

# Monorepo trigger: only fires when backend/ (or this workflow) changes, so a
# frontend/mobile/ai-service-only push never rebuilds or redeploys the Go API.
on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy-develop
  cancel-in-progress: true

jobs:
  # Same go vet/test steps as ci-pr.yml's PR gate — defined once in
  # backend-test.yml so a broken build can't reach build-and-push here either.
  test:
    uses: ./.github/workflows/backend-test.yml

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only backend/ is sent to the Docker build context — the image never
      # contains frontend/mobile/ai-service source, keeping it small and the
      # blast radius of a backend deploy limited to the backend.
      # load: true keeps a copy in the runner's local Docker daemon (alongside
      # the registry push) so Trivy below can scan the exact image being
      # shipped without a second build.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:${{ github.sha }}

      # Non-blocking for now (exit-code 0): reports HIGH/CRITICAL CVEs in the
      # job log without failing the deploy. Once the team has triaged the
      # baseline findings on alpine/ca-certificates etc., flip exit-code to
      # '1' to make new criticals actually gate the deploy.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/pfm-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Only the backend's deploy files land on the VPS — no frontend/
      # mobile/ai-service source ever leaves the CI runner.
      - name: Sync deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/deploy.sh,backend/docker-compose.yml,backend/db/migrations,backend/ops"
          target: "${{ secrets.VPS_APP_DIR }}"

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}/backend"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            if [ -n "${{ secrets.VPS_ENV_PROD }}" ]; then
              printf '%s\n' "${{ secrets.VPS_ENV_PROD }}" | sed -e 's/\r$//' > .env.prod
            fi

            chmod +x deploy.sh

            # .last_good_tag persists on the VPS across runs (this SCP step
            # only adds/overwrites deploy.sh/docker-compose.yml/migrations, it
            # never deletes other files here) — it's how a failed health
            # check below knows which image tag to roll back to.
            LAST_GOOD_TAG_FILE=".last_good_tag"
            NEW_TAG="${{ github.sha }}"
            PREV_TAG=""
            if [ -f "$LAST_GOOD_TAG_FILE" ]; then
              PREV_TAG="$(cat "$LAST_GOOD_TAG_FILE")"
            fi

            deploy_tag() {
              DOCKER_REGISTRY_USER="${{ secrets.DOCKERHUB_USERNAME }}" \
                PFM_BACKEND_IMAGE_TAG="$1" \
                ./deploy.sh
            }

            check_health() {
              attempts="$1"
              i=1
              while [ "$i" -le "$attempts" ]; do
                if docker exec pfm-backend-container wget -qO /dev/null http://127.0.0.1:8080/api/v1/health; then
                  return 0
                fi
                echo "Attempt ${i}/${attempts}: health endpoint not ready, retrying in 10s"
                sleep 10
                i=$((i + 1))
              done
              return 1
            }

            deploy_tag "$NEW_TAG"

            if check_health 20; then
              echo "Health check passed: /api/v1/health is up (tag ${NEW_TAG})"
              echo "$NEW_TAG" > "$LAST_GOOD_TAG_FILE"
              exit 0
            fi

            echo "Health check timeout: /api/v1/health never came up for tag ${NEW_TAG}"
            docker logs --tail 200 pfm-backend-container || true

            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
              echo "Rolling back to last known-good image tag: ${PREV_TAG}"
              deploy_tag "$PREV_TAG"
              if check_health 10; then
                echo "Rollback to ${PREV_TAG} succeeded"
              else
                echo "Rollback to ${PREV_TAG} FAILED — manual intervention required"
                docker logs --tail 200 pfm-backend-container || true
              fi
            else
              echo "No previous known-good tag recorded — nothing to roll back to. Manual intervention required."
            fi

            # This run still fails either way: the pushed commit never became
            # healthy, so CI must go red even though prod was protected.
            exit 1
