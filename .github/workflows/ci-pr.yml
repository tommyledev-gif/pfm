name: PR Checks

# Quality gate for PRs into develop: runs the backend checks (vet, migrations,
# tests with the race detector against a real Postgres, govulncheck), the
# ai-service tests, and the frontend and mobile lint/typecheck, but only for
# the areas a given PR actually touches — a docs-only PR doesn't pay for a Go
# or Next.js run it can't affect. deploy-backend.yml stays push-triggered and unaffected by this file.
on:
  pull_request:
    branches:
      - develop

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            ai-service:
              - 'ai-service/**'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-test.yml

  ai-service-test:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    uses: ./.github/workflows/ai-service-test.yml

  # mobile/ has no unit tests (verification is tsc + eslint + a run on a
  # device), so the typecheck is the gate. Lint runs too; its existing
  # warnings do not fail it, new errors do.
  mobile-check:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
