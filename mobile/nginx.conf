server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # go_router uses path-based (non-hash) URLs, so any deep link must fall
    # back to index.html and let Flutter's router take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|json|wasm)$ {
        expires 7d;
        access_log off;
    }
}
