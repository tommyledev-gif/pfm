# Production compose for the backend + ai-service — deployed to the VPS by
# .github/workflows/deploy-backend.yml and deploy-ai-service.yml. Not used
# for local dev (see the root docker-compose.yml, which also runs frontend
# and builds images locally instead of pulling from a registry).
#
# Variable substitution below (${VAR}) is resolved by `docker compose
# --env-file .env.prod ...` (see deploy.sh) — .env.prod itself is written on
# the VPS from the VPS_ENV_PROD GitHub secret, it is never committed.

# Local container logs are size-capped so they can never fill the disk.
# Retention by age (30 d normal / 60 d severe) is done off-box by
# ops/archive-logs.sh, which ships each day's logs to R2 before rotation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  pfm-postgres:
    image: postgres:16-alpine
    container_name: pfm-postgres-container
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Security: bind only to localhost — nothing but pfm-backend needs this.
      - "127.0.0.1:${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - pfm_postgres_data:/var/lib/postgresql/data
      # Mounted individually (not the whole migrations/ dir) so
      # 002_seed_admin.sql — a manual, placeholder-hash script never meant to
      # autorun — stays excluded. Mirrors the root docker-compose.yml mount list.
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migrations/003_revoked_tokens.sql:/docker-entrypoint-initdb.d/02_revoked_tokens.sql:ro
      - ./db/migrations/004_wallets.sql:/docker-entrypoint-initdb.d/03_wallets.sql:ro
      - ./db/migrations/005_categories.sql:/docker-entrypoint-initdb.d/04_categories.sql:ro
      - ./db/migrations/006_seed_categories.sql:/docker-entrypoint-initdb.d/05_seed_categories.sql:ro
      - ./db/migrations/007_budgets.sql:/docker-entrypoint-initdb.d/06_budgets.sql:ro
      - ./db/migrations/008_transactions.sql:/docker-entrypoint-initdb.d/07_transactions.sql:ro
      - ./db/migrations/009_notifications.sql:/docker-entrypoint-initdb.d/08_notifications.sql:ro
      - ./db/migrations/010_transactions_idempotency_key.sql:/docker-entrypoint-initdb.d/09_transactions_idempotency_key.sql:ro
      - ./db/migrations/011_chat_messages.sql:/docker-entrypoint-initdb.d/10_chat_messages.sql:ro
      - ./db/migrations/012_categories_icon_url.sql:/docker-entrypoint-initdb.d/11_categories_icon_url.sql:ro
      - ./db/migrations/013_wallets_icon.sql:/docker-entrypoint-initdb.d/12_wallets_icon.sql:ro
      - ./db/migrations/014_budgets_icon.sql:/docker-entrypoint-initdb.d/13_budgets_icon.sql:ro
      # 015-018 were missing from this list entirely, so even a freshly
      # initialized volume came up without chat_thread_messages (015) or
      # transaction_audit_logs (018) — /ai/chat/thread, /ai/chat/thread/sync,
      # /transactions/audit-logs and (since the audit write is inside the
      # create transaction) POST /transactions all 500'd on SQLSTATE 42P01.
      #
      # ⚠️ Mounting them here only helps a *fresh* volume: initdb scripts run
      # once, on first initialization. An already-running environment still
      # needs these applied by hand — see the note in deploy.sh.
      - ./db/migrations/015_chat_thread_sync.sql:/docker-entrypoint-initdb.d/14_chat_thread_sync.sql:ro
      - ./db/migrations/016_transactions_created_at_sort_index.sql:/docker-entrypoint-initdb.d/15_transactions_created_at_sort_index.sql:ro
      - ./db/migrations/017_seed_savings_category.sql:/docker-entrypoint-initdb.d/16_seed_savings_category.sql:ro
      - ./db/migrations/018_transaction_audit_logs.sql:/docker-entrypoint-initdb.d/17_transaction_audit_logs.sql:ro
      # F-13.1 Phase 1 (specs/ai-budget-wizard-v2/plan.md BWZ2-T02).
      # ⚠️ Same caveat as 015-018: a running VPS volume needs these applied
      # by hand — initdb only fires on first initialization.
      - ./db/migrations/019_categories_system_key.sql:/docker-entrypoint-initdb.d/18_categories_system_key.sql:ro
      - ./db/migrations/020_budget_plans.sql:/docker-entrypoint-initdb.d/19_budget_plans.sql:ro
      # Feature-12 US-03 (specs/ai-chat-query-spending/plan.md AIQ-T11).
      - ./db/migrations/021_intent_parse_log.sql:/docker-entrypoint-initdb.d/20_intent_parse_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_POSTGRES:-512M}

  pfm-backend:
    image: ${DOCKER_REGISTRY_USER}/pfm-backend:${PFM_BACKEND_IMAGE_TAG:-latest}
    container_name: pfm-backend-container
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 8080
      # Selects the JSON production logger (main.go newLogger). Unset, the
      # server ran zap's development logger in production: debug-level console
      # output with stack traces, which is not what ops/archive-logs.sh parses.
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pfm-postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      # Leave blank/unset — the Go default (http://ai-service:8000, see
      # internal/config/config.go) already resolves to the ai-service
      # container below via the compose network. No hard dependency: if
      # ai-service is down/misconfigured, POST /ai/chat just degrades to
      # 502 AI_SERVICE_UNAVAILABLE instead of failing backend startup.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      # Cloudflare R2 storage for user-uploaded category icons (see
      # service.R2IconUploader). Blank R2_ACCOUNT_ID means "not configured
      # yet" — main.go falls back to service.UnconfiguredIconUploader and
      # POST /categories/icon degrades to 503 ICON_UPLOAD_UNAVAILABLE.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # Read only by ./seed (see deploy.sh), not by the server process. Blank
      # means "skip admin bootstrap" — set these in .env.prod only for the
      # very first deploy of a fresh environment (invite-only auth has no one
      # to send the first invite from otherwise).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    ports:
      # ⚠️ Docker publishes ports through its own iptables chain, BEFORE ufw,
      # so setup-ufw.sh's Cloudflare-only rule never applied to this port.
      # Once traffic arrives through pfm-cloudflared, set
      # BACKEND_BIND_ADDRESS=127.0.0.1 and nothing is exposed at all
      # (docs/ops-runbook.md §Cloudflare Tunnel). The default keeps the old
      # public port so a deploy without a tunnel never takes the API down.
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT_EXTERNAL:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      pfm-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BACKEND:-512M}

  # Python AI Service — internal only, no host-mapped port (backend reaches
  # it over the compose network by service name, matching root
  # docker-compose.yml's dev setup and specs/ai-chat-assistant/plan.md
  # Finding #5). Image is built/pushed by deploy-ai-service.yml, not built
  # on the VPS.
  ai-service:
    image: ${DOCKER_REGISTRY_USER}/pfm-ai-service:${PFM_AI_SERVICE_IMAGE_TAG:-latest}
    container_name: pfm-ai-service-container
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      # python:3.12-slim has no wget/curl; urlopen raises (exit 1) on non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_AI_SERVICE:-192M}

  # Cloudflare Tunnel: an outbound, encrypted connection from this box to
  # Cloudflare, so Cloudflare → origin never travels as plain HTTP and no
  # inbound port has to be open. The public hostname's service is
  # http://pfm-backend:8080, set in the Cloudflare dashboard. Started only
  # when CLOUDFLARE_TUNNEL_TOKEN is set (deploy.sh enables this profile).
  pfm-cloudflared:
    # Not pinned on purpose: Cloudflare stops supporting cloudflared releases
    # after a year, so a pinned tag silently ages into a broken tunnel.
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: pfm-cloudflared-container
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - pfm-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_CLOUDFLARED:-128M}

volumes:
  pfm_postgres_data:
    driver: local
