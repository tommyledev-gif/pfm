services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD_HASH: ${ADMIN_SEED_PASSWORD_HASH}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pfm_pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/db/migrations/003_revoked_tokens.sql:/docker-entrypoint-initdb.d/02_revoked_tokens.sql:ro
      - ./backend/db/migrations/004_wallets.sql:/docker-entrypoint-initdb.d/03_wallets.sql:ro
      - ./backend/db/migrations/005_categories.sql:/docker-entrypoint-initdb.d/04_categories.sql:ro
      - ./backend/db/migrations/006_seed_categories.sql:/docker-entrypoint-initdb.d/05_seed_categories.sql:ro
      - ./backend/db/migrations/007_budgets.sql:/docker-entrypoint-initdb.d/06_budgets.sql:ro
      - ./backend/db/migrations/008_transactions.sql:/docker-entrypoint-initdb.d/07_transactions.sql:ro
      - ./infra/postgres/init/seed_dev_admin.sh:/docker-entrypoint-initdb.d/08_seed_dev_admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pfm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pfm_network

  # Flutter web build (mobile/) — kept as-is; not to be confused with `web` below.
  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - pfm_network

  # Next.js web app (frontend/) — second client for the same features, BFF-proxies to backend.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "${WEB_FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - pfm_network

volumes:
  pfm_pgdata:

networks:
  pfm_network:
    driver: bridge
