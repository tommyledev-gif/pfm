services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD_HASH: ${ADMIN_SEED_PASSWORD_HASH}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pfm_pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/db/migrations/003_revoked_tokens.sql:/docker-entrypoint-initdb.d/02_revoked_tokens.sql:ro
      - ./backend/db/migrations/004_wallets.sql:/docker-entrypoint-initdb.d/03_wallets.sql:ro
      - ./backend/db/migrations/005_categories.sql:/docker-entrypoint-initdb.d/04_categories.sql:ro
      - ./backend/db/migrations/006_seed_categories.sql:/docker-entrypoint-initdb.d/05_seed_categories.sql:ro
      - ./backend/db/migrations/007_budgets.sql:/docker-entrypoint-initdb.d/06_budgets.sql:ro
      - ./backend/db/migrations/008_transactions.sql:/docker-entrypoint-initdb.d/07_transactions.sql:ro
      - ./backend/db/migrations/009_notifications.sql:/docker-entrypoint-initdb.d/08_notifications.sql:ro
      - ./backend/db/migrations/010_transactions_idempotency_key.sql:/docker-entrypoint-initdb.d/09_transactions_idempotency_key.sql:ro
      - ./backend/db/migrations/011_chat_messages.sql:/docker-entrypoint-initdb.d/10_chat_messages.sql:ro
      - ./backend/db/migrations/012_categories_icon_url.sql:/docker-entrypoint-initdb.d/11_categories_icon_url.sql:ro
      - ./infra/postgres/init/seed_dev_admin.sh:/docker-entrypoint-initdb.d/11_seed_dev_admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pfm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      AI_SERVICE_URL: http://ai-service:8000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pfm_network

  # Python AI Service (ai-service/) — internal only, no host port. Backend
  # reaches it via the compose service name (AI_SERVICE_URL above), never a
  # host-mapped port (specs/ai-chat-assistant/plan.md Finding #5).
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    networks:
      - pfm_network

  # mobile/ (React Native + Expo) is intentionally NOT containerized. Expo's
  # dev flow is `npx expo start` (Metro bundler + Expo Go / a simulator), not
  # a Docker-served build — unlike the old Flutter setup, there is no static
  # web bundle to serve via nginx at this stage. If a containerized web
  # preview is ever needed, `npx expo export --platform web` produces a
  # static bundle that could be added back as a service then.

  # Next.js web app (frontend/) — second client for the same features, BFF-proxies to backend.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "${WEB_FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - pfm_network

volumes:
  pfm_pgdata:

networks:
  pfm_network:
    driver: bridge
