services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only by default: published on every interface, the dev
      # database (with its dev password) was reachable from the whole Wi-Fi.
      # Set POSTGRES_BIND_ADDRESS=0.0.0.0 only if another machine needs it.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      # Starts empty: the `migrate` service below builds the whole schema.
      # (Migrations used to be mounted into docker-entrypoint-initdb.d too, a
      # hand-kept list that drifted behind backend/db/migrations/ twice.)
      - pfm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pfm_network

  # Applies every pending migration, then exits: the same ledger-based runner
  # production (deploy.sh) and CI (backend-test.yml) use, so a fresh volume
  # gets exactly the schema they do.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pfm-backend-dev
    entrypoint: ["./migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - pfm_network

  # Creates the first admin (invite-only sign-up has nobody to invite from
  # otherwise), then exits: the same cmd/seed production runs. Skipped when
  # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD are blank. Runs on every `up` and
  # resets that admin's password to SEED_ADMIN_PASSWORD each time.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pfm-backend-dev
    entrypoint: ["./seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - pfm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pfm-backend-dev
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_IMAGE_ENABLED: ${AI_IMAGE_ENABLED:-false}
      ACCOUNT_DELETION_OPERATOR_EMAIL: ${ACCOUNT_DELETION_OPERATOR_EMAIL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-}
      ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - pfm_network

  # Python AI Service (ai-service/) — internal only, no host port. Backend
  # reaches it via the compose service name (AI_SERVICE_URL above), never a
  # host-mapped port (specs/ai-chat-assistant/plan.md Finding #5).
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    networks:
      - pfm_network

  # mobile/ (React Native + Expo) is intentionally NOT containerized. Expo's
  # dev flow is `npx expo start` (Metro bundler + Expo Go / a simulator), not
  # a Docker-served build — unlike the old Flutter setup, there is no static
  # web bundle to serve via nginx at this stage. If a containerized web
  # preview is ever needed, `npx expo export --platform web` produces a
  # static bundle that could be added back as a service then.

  # Next.js web app (frontend/) — second client for the same features, BFF-proxies to backend.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "${WEB_FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - pfm_network

volumes:
  pfm_pgdata:

networks:
  pfm_network:
    driver: bridge
