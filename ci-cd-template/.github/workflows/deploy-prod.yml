name: CI-CD Prod Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/krows-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/krows-api:${{ github.sha }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy.sh,docker-compose.yml"
          target: "${{ secrets.VPS_APP_DIR }}"

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            if [ -n "${{ secrets.VPS_ENV_PROD }}" ]; then
              printf '%s\n' "${{ secrets.VPS_ENV_PROD }}" \
                | sed -e 's/\r$//' -e '/^DRONE_SSH_PREV_COMMAND_EXIT_CODE=/d' \
                > .env.prod
            fi

            # Ensure production API is reachable by Cloudflare on port 80.
            if grep -q '^API_PORT_EXTERNAL=' .env.prod; then
              sed -i 's/^API_PORT_EXTERNAL=.*/API_PORT_EXTERNAL=80/' .env.prod
            else
              printf '\nAPI_PORT_EXTERNAL=80\n' >> .env.prod
            fi

            if grep -q '^JWT_ACCESS_EXPIRES_IN=' .env.prod; then
              sed -i 's/^JWT_ACCESS_EXPIRES_IN=.*/JWT_ACCESS_EXPIRES_IN=5h/' .env.prod
            else
              printf '\nJWT_ACCESS_EXPIRES_IN=5h\n' >> .env.prod
            fi

            chmod +x deploy.sh
            KROWS_API_IMAGE_TAG="${{ github.sha }}" ./deploy.sh prod

            for i in $(seq 1 20); do
              code=$(docker exec krows-api-container node -e "const http=require('http');const p=Number(process.env.API_PORT_INTERNAL||6769);http.get({host:'localhost',port:p,path:'/api/v1/health',timeout:4000},r=>{process.stdout.write(String(r.statusCode));process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).on('timeout',function(){this.destroy();process.exit(1);});" 2>/dev/null || true)
              if [ "${code}" = "200" ]; then
                echo "Health check passed: /api/v1/health returned 200"
                exit 0
              fi

              echo "Attempt ${i}/20: health endpoint not ready, retrying in 10s"
              sleep 10
            done

            echo "Health check timeout: /api/v1/health did not return 200"
            docker logs --tail 200 krows-api-container || true
            exit 1
